name: "Terraform CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Usar v3.1.2 para corregir las claves PGP expiradas de HashiCorp
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
        rm -rf .terraform .terraform.lock.hcl
        terraform init -upgrade 
# Crear el archivo directamente en la carpeta actual (environments/dev)
      - name: Create Dummy SSH Public Key
        run: echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCdummykeygithubactions" > nginx-server.key.pub
      
      - name: Terraform Plan
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_environment: "dev"
          TF_VAR_instance_type: "t3.micro"
          TF_VAR_public_key_path: "nginx-server.key.pub"
          TF_VAR_root_volume_size: "8"
          TF_VAR_db_name: "appdb"
          TF_VAR_db_user: "dbadmin"
          TF_VAR_db_password: "password"
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
  
  #===================================================================================================================
  #FASE 2: Build & Push de la imagen Docker a AWS ECR
  #===================================================================================================================
  docker-build:
    name: "Build & Push Docker Image"
    needs: terraform
    if: github.ref == 'refs/head/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/ckeckout@4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actuons/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: empresa-x-backend-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          