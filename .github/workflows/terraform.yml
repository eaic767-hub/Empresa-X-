name: Terraform Deploy & Destroy

on:
  push:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Provisioning
    runs-on: ubuntu-latest
    outputs:
      ecr_repo: ${{ steps.extract-ecr.outputs.repo_name }}
      eks_cluster: ${{ steps.extract-eks.outputs.cluster_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init (Sandbox por Rama)
        working-directory: ./infra/environments/dev
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
          
          echo "Configurando Terraform Init para aislar el sandbox en la rama: $SAFE_BRANCH_NAME"
          
          terraform init \
            -backend-config="key=sandbox/$SAFE_BRANCH_NAME/terraform.tfstate"

      # --- FASE 1: DESTRUCCIÓN Y LIMPIEZA PREVIA BLINDADA ---
      - name: Pre-Destroy Cleanup & ENI Release
        if: github.event.inputs.action == 'destroy' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'destroy'))
        run: |
          echo "Iniciando barrido quirúrgico y liberación de red en AWS antes de destruir Terraform..."
          
          cd ./infra/environments/dev
          
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
          
          if [ -n "$CLUSTER_NAME" ] && [ -n "$VPC_ID" ]; then
            echo "Clúster detectado: $CLUSTER_NAME en la VPC:$VPC_ID. Actualizando kubeconfig..."
            aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME" || true
            
            echo "1. Desinstalando charts de Helm conflictivos (Prometheus, LBC)..."
            helm uninstall prometheus-stack -n monitoring || true
            helm uninstall aws-load-balancer-controller -n kube-system || true
            helm uninstall metrics-server -n kube-system || true
            
            echo "2. Purgando todos los objetos de red de Kubernetes..."
            kubectl delete hpa --all --all-namespaces --timeout=20s || true
            kubectl delete ingress --all --all-namespaces --timeout=30s || true
            kubectl delete svc --all --all-namespaces --timeout=30s || true
            kubectl delete statefulset --all --all-namespaces --timeout=30s || true
            kubectl delete namespace monitoring --timeout=30s || true
            
            echo "3. Forzando la liberación de ENIs y desvinculando Network Interfaces colgadas..."
            for i in {1..10}; do
              ENI_IDS=$(aws ec2 describe-network-interfaces --filters Name=vpc-id,Values="$VPC_ID" Name=status,Values="in-use" --query 'NetworkInterfaces[?contains(Description, `ELB`) || contains(Description, `AWS Elastic Load Balancing`) || contains(OwnerId, `amazon`)]|[?attachment.status==`attached`].networkInterfaceId' --output text 2>/dev/null || echo "")
              
              if [ -z "$ENI_IDS" ]; then
                echo "¡No quedan ENIs bloqueantes de balanceadores en la VPC!"
                break
              fi
              
              echo "Intento $i/10: Encontradas ENIs retenidas ($ENI_IDS). Intentando desasociar..."
              for eni in $ENI_IDS; do
                ATTACHMENT_ID=$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" --query 'NetworkInterfaces[0].attachment.attachmentId' --output text 2>/dev/null || echo "")
                if [ -n "$ATTACHMENT_ID" ] && [ -n "$ATTACHMENT_ID" != "None" ]; then
                  aws ec2 detach-network-interface --attachment-id "$ATTACHMENT_ID" --force || true
                fi
              done
              sleep 10
            done
            
            echo "4. Pausa de estabilización final de red..."
            sleep 20
          else
            echo "No se encontró un clúster activo o los outputs no están disponibles. Saltando limpieza de K8s y pasando directo a Terraform."
          fi

      # --- FASE 2: EJECUCIÓN DE APPLY O DESTROY CON AUTO-APPROVE ---
      - name: Terraform Apply or Destroy
        working-directory: ./infra/environments/dev
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            ACTION="apply"
          fi
          
          if [ "$ACTION" = "destroy" ]; then
            echo "Ejecutando Terraform Destroy con auto-approve..."
            terraform destroy -auto-approve
          else
            echo "Ejecutando Terraform Apply con auto-approve..."
            terraform apply -auto-approve
          fi

      # --- FASE 3: POST-APPLY CONFIGURACIONES (Solo si NO es destroy) ---
      - name: Configure Kubeconfig & Deploy LBC ServiceAccount
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          ROLE_ARN=$(terraform output -raw aws_load_balancer_controller_irsa_iam_role_arn || echo "")
          
          if [ -n "$CLUSTER_NAME" ]; then
            echo "Actualizando kubeconfig para el clúster: $CLUSTER_NAME"
            aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME"
          fi
          
          if [ -n "$ROLE_ARN" ]; then
            echo "Configurando la ServiceAccount de Kubernetes con el rol IRSA: $ROLE_ARN"
            kubectl create serviceaccount aws-load-balancer-controller -n kube-system --dry-run=client -o yaml | kubectl apply -f -
            kubectl annotate serviceaccount aws-load-balancer-controller -n kube-system eks.amazonaws.com/role-arn="$ROLE_ARN" --overwrite
          else
            echo "Aviso: No se pudo obtener el ARN del rol IRSA desde Terraform outputs."
          fi

      - name: Deploy Prometheus RBAC to EKS
        if: github.event.inputs.action != 'destroy'
        run: |
          REPO_ROOT="${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}"
          echo "Creando namespace de monitoreo y aplicando RBAC para Prometheus..."
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f "$REPO_ROOT/k8s/prometheus-rbac.yaml"

      - name: Install AWS Load Balancer Controller via Helm
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          VPC_ID=$(terraform output -raw vpc_id || echo "")

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=us-east-1 \
            --set vpcId="$VPC_ID"

      - name: Install Metrics Server via Helm
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          for i in {1..12}; do
            if kubectl get endpoints aws-load-balancer-webhook-service -n kube-system &>/dev/null; then
              ENDPOINTS=$(kubectl get endpoints aws-load-balancer-webhook-service -n kube-system -o jsonpath='{.subsets[*].addresses[*].ip}')
              if [ -n "$ENDPOINTS" ]; then
                break
              fi
            fi
            sleep 10
          done
          sleep 15

          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system

      - name: Extract ECR Repository Name
        id: extract-ecr
        working-directory: ./infra/environments/dev
        if: github.event.inputs.action != 'destroy'
        run: |
          REPO_NAME=$(terraform output -raw ecr_repository_name)
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Extract EKS Cluster Name
        id: extract-eks
        working-directory: ./infra/environments/dev
        if: github.event.inputs.action != 'destroy'
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

  docker-build:
    name: Build & Push Docker Image
    needs: terraform
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        working-directory: ./app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.terraform.outputs.ecr_repo }}
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
         
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: [terraform, docker-build]
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID