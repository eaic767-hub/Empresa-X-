name: Terraform Deploy & Destroy

on:
  push:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Provisioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/environments/dev

      # Pre-Destroy Cleanup: Fuerza la eliminación de servicios LoadBalancer y ENIs colgados antes de destruir
      - name: Pre-Destroy Cleanup (ELB & ENI Release)
        if: github.event.inputs.action == 'destroy' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'destroy'))
        run: |
          echo "Iniciando limpieza previa de recursos huérfanos de Kubernetes..."
          CLUSTER_NAME="${{ github.ref == 'refs/heads/main' && 'empresa-x-cluster-dev' || 'empresa-x-cluster-emanuel-dev' }}"
          
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME" || true
          kubectl delete svc --all --all-namespaces --timeout=30s || true
          
          echo "Esperando 60 segundos para que AWS libere las ENIs y los Balanceadores de Carga..."
          sleep 60

      - name: Terraform Apply or Destroy
        working-directory: ./infra/environments/dev
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            ACTION="apply"
          fi
          
          echo "Contenido actual en ./infra/environments/dev:"
          ls -la

          if [ "$ACTION" = "destroy" ]; then
            echo "Ejecutando Terraform Destroy..."
            terraform destroy -auto-approve
          else
            echo "Ejecutando Terraform Apply..."
            terraform apply -auto-approve
          fi

  docker-build:
    name: Build & Push Docker Image
    needs: terraform
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: empresa-x-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy-k8s:
    name: Deploy to Kubernetes
    needs: [terraform, docker-build]
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig for EKS
        env:
          EKS_CLUSTER_NAME: ${{ github.ref == 'refs/heads/main' && 'empresa-x-cluster-dev' || 'empresa-x-cluster-emanuel-dev' }}
        run: |
          echo "Conectando al clúster EKS: $EKS_CLUSTER_NAME"
          for i in {1..5}; do
            aws eks update-kubeconfig --region us-east-1 --name "$EKS_CLUSTER_NAME" && break || {
              echo "Intento $i falló. El clúster aún se está preparando, reintentando en 15 segundos..."
              sleep 15
            }
          done

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/storage-class.yaml
          kubectl apply -f k8s/statefulset.yaml
          kubectl apply -f k8s/service.yaml