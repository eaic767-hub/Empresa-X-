name: "Terraform & Docker CI/CD Pipeline"

on:
  push:
    branches: [ "main", "feature/*", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Acción de Terraform a ejecutar"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/environments/dev

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_resource_prefix: "emanuel"  # <--- IMPORTANTE PARA EL SANDBOX
      TF_VAR_instance_type: "t3.micro"
      TF_VAR_public_key_path: "nginx-server.key.pub"
      TF_VAR_root_volume_size: "8"
      TF_VAR_db_name: "appdb"
      TF_VAR_db_user: "dbadmin"
      TF_VAR_db_password: "password"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate Valid SSH Key Pair
        run: ssh-keygen -t rsa -b 2048 -f nginx-server.key -N ""

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Dynamic Sandbox State)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            STATE_KEY="dev/terraform.tfstate"
          else
            STATE_KEY="sandbox/emanuel/terraform.tfstate"
          fi
          echo "Using Terraform State Key: $STATE_KEY"
          terraform init -upgrade -backend-config="key=$STATE_KEY"

      - name: Terraform Plan
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.terraform_action == 'apply' }}
        run: |
          terraform plan -input=false -no-color > plan_output.log 2>&1 || true
          cat plan_output.log

      - name: Terraform Apply (Auto in Sandbox / Controlled in Main)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.terraform_action == 'apply' }}
        run: |
          echo "Ejecutando Terraform Apply..."
          terraform apply -input=false -auto-approve -no-color > apply_output.log 2>&1 || true
          cat apply_output.log
          if grep -q "Error:" apply_output.log; then exit 1; fi

      - name: Terraform Destroy (Manual Triggered)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action == 'destroy' }}
        run: |
          echo "Ejecutando Terraform Destroy para limpiar el sandbox..."
          terraform destroy -input=false -auto-approve -no-color

  docker-build:
    name: "Build & Push Docker Image"
    needs: terraform
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.terraform_action != 'destroy' }}

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && 'empresa-x-backend-dev' || 'empresa-x-backend-dev-emanuel' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region us-east-1 || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region us-east-1

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-k8s:
    name: "Deploy Manifest to EKS"
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig for EKS
        env:
          EKS_CLUSTER_NAME: ${{ github.ref == 'refs/heads/main' && 'empresa-x-cluster-dev' || 'empresa-x-cluster-emanuel-dev' }}
        run: |
          echo "Conectando al clúster EKS: $EKS_CLUSTER_NAME"
          aws eks update-kubeconfig --region us-east-1 --name "$EKS_CLUSTER_NAME"

      - name: Substitute ECR Repository in Manifest
        env:
          ECR_REPO: ${{ github.ref == 'refs/heads/main' && 'empresa-x-backend-dev' || 'empresa-x-backend-dev-emanuel' }}
        run: |
          echo "Inyectando repositorio ECR dinámico: $ECR_REPO"
          sed -i "s|__ECR_REPOSITORY__|$ECR_REPO|g" k8s/app-deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          echo "Aplicando manifiestos de Kubernetes..."
          kubectl apply -f k8s/ 
