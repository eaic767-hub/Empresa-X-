name: Terraform Deploy & Destroy

on:
  push:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Provisioning
    runs-on: ubuntu-latest
    outputs:
      ecr_repo: ${{ steps.extract-ecr.outputs.repo_name }}
      eks_cluster: ${{ steps.extract-eks.outputs.cluster_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra/environments/dev

      # --- PASO BLINDADO DE PRE-DESTRUCTION ---
      - name: Pre-Destroy Cleanup & ENI Release
        if: github.event.inputs.action == 'destroy' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'destroy'))
        run: |
          echo "Conectando al clúster antes de destruirlo para barrer Ingress, LoadBalancers y liberar dependencias de AWS..."
          
          cd ./infra/environments/dev
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          
          if [ -n "$CLUSTER_NAME" ]; then
            echo "Clúster detectado: $CLUSTER_NAME. Actualizando kubeconfig..."
            aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME" || true
            
            echo "1. Borrando objetos HPA y Ingress para forzar a AWS a eliminar los ALBs asociados..."
            kubectl delete hpa --all --all-namespaces --timeout=30s || true
            kubectl delete ingress --all --all-namespaces --timeout=60s || true
            
            echo "2. Eliminando todos los servicios Kubernetes..."
            kubectl delete svc --all --all-namespaces --timeout=30s || true
            
            echo "3. Desinstalando el AWS Load Balancer Controller vía Helm para apagar el controlador..."
            helm uninstall aws-load-balancer-controller -n kube-system || true
            
            echo "4. Esperando 90 segundos obligatorios para que AWS destruya físicamente los ALBs y libere las ENIs..."
            sleep 90
          else
            echo "No se encontró un clúster activo o ya fue destruido. Saltando limpieza de K8s."
          fi

      - name: Terraform Apply or Destroy
        working-directory: ./infra/environments/dev
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            ACTION="apply"
          fi
          
          if [ "$ACTION" = "destroy" ]; then
            echo "Ejecutando Terraform Destroy..."
            terraform destroy -auto-approve
          else
            echo "Ejecutando Terraform Apply..."
            terraform apply -auto-approve
          fi

      # --- ACTUALIZAR KUBECONFIG Y CREAR SERVICEACCOUNT CON KUBECTL ---
      - name: Configure Kubeconfig & Deploy LBC ServiceAccount
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          ROLE_ARN=$(terraform output -raw aws_load_balancer_controller_irsa_iam_role_arn || echo "")
          
          if [ -n "$CLUSTER_NAME" ]; then
            echo "Actualizando kubeconfig para el clúster: $CLUSTER_NAME"
            aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME"
          fi
          
          if [ -n "$ROLE_ARN" ]; then
            echo "Configurando la ServiceAccount de Kubernetes con el rol IRSA: $ROLE_ARN"
            kubectl create serviceaccount aws-load-balancer-controller -n kube-system --dry-run=client -o yaml | kubectl apply -f -
            kubectl annotate serviceaccount aws-load-balancer-controller -n kube-system eks.amazonaws.com/role-arn="$ROLE_ARN" --overwrite
          else
            echo "Aviso: No se pudo obtener el ARN del rol IRSA desde Terraform outputs."
          fi

      # --- INSTALAR EL AWS LOAD BALANCER CONTROLLER VÍA HELM ---
      - name: Install AWS Load Balancer Controller via Helm
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          echo "Agregando repositorio de Helm para EKS..."
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          VPC_ID=$(terraform output -raw vpc_id || echo "")

          echo "Instalando o actualizando el AWS Load Balancer Controller en el clúster..."
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=us-east-1 \
            --set vpcId="$VPC_ID"

      # --- INSTALAR EL METRICS SERVER PARA EL HPA ---
      - name: Install Metrics Server via Helm
        if: github.event.inputs.action != 'destroy'
        working-directory: ./infra/environments/dev
        run: |
          echo "Esperando a que el webhook del Load Balancer Controller esté listo..."
          for i in {1..12}; do
            if kubectl get endpoints aws-load-balancer-webhook-service -n kube-system &>/dev/null; then
              ENDPOINTS=$(kubectl get endpoints aws-load-balancer-webhook-service -n kube-system -o jsonpath='{.subsets[*].addresses[*].ip}')
              if [ -n "$ENDPOINTS" ]; then
                echo "¡Webhook del LBC detectado con endpoints activos!"
                break
              fi
            fi
            echo "Intento $i/12: Esperando endpoints del webhook del LBC..."
            sleep 10
          done

          echo "Dando 15 segundos adicionales para la estabilización completa de los certificados TLS del Webhook..."
          sleep 15

          echo "Agregando repositorio de Helm para Metrics Server..."
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update

          echo "Instalando Metrics Server en el clúster para habilitar el Auto-Escalado (HPA)..."
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system

      - name: Extract ECR Repository Name
        id: extract-ecr
        working-directory: ./infra/environments/dev
        if: github.event.inputs.action != 'destroy'
        run: |
          REPO_NAME=$(terraform output -raw ecr_repository_name)
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "Repositorio ECR detectado con éxito: $REPO_NAME"

      - name: Extract EKS Cluster Name
        id: extract-eks
        working-directory: ./infra/environments/dev
        if: github.event.inputs.action != 'destroy'
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "Clúster EKS detectado con éxito: $CLUSTER_NAME"

  docker-build:
    name: Build & Push Docker Image
    needs: terraform
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        working-directory: ./app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ needs.terraform.outputs.ecr_repo }}
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: [terraform, docker-build]
    if: github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig for EKS
        env:
          EKS_CLUSTER_NAME: ${{ needs.terraform.outputs.eks_cluster }}
        run: |
          echo "Conectando al clúster EKS dinámico: $EKS_CLUSTER_NAME"
          for i in {1..5}; do
            aws eks update-kubeconfig --region us-east-1 --name "$EKS_CLUSTER_NAME" && break || {
              echo "Intento $i falló. El clúster aún se está preparando, reintentando en 15 segundos..."
              sleep 15
            }
          done
          kubectl cluster-info

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/storage-class.yaml
          kubectl apply -f k8s/statefulset.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml