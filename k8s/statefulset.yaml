apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hola-mundo-deployment
  namespace: default
  labels:
    app: hola-mundo
spec:
  serviceName: "hola-mundo-service"
  replicas: 2  
  selector:
    matchLabels:
      app: hola-mundo
  template:
    metadata:
      labels:
        app: hola-mundo
    spec:
      containers:
      - name: backend-app  # Tu nombre de contenedor exacto
        image: 798474696671.dkr.ecr.us-east-1.amazonaws.com/empresa-x-backend-dev-emanuel:latest
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args: ["php -S 0.0.0.0:8080 -t /var/www/html"]
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        # Montaje del volumen persistente de EBS
        volumeMounts:
        - name: app-storage
          mountPath: /app/data
  
  volumeClaimTemplates:
  - metadata:
      name: app-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-gp3-sc"  # Usa la StorageClass que creamos
      resources:
        requests:
          storage: 10Gi