apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: monitoring
  labels:
    app: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: backend
        image: 798474696671.dkr.ecr.us-east-1.amazonaws.com/empresa-x-backend:__IMAGE_TAG__
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL