apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: empresa-x-ingress
  namespace: default
  annotations:
    # Le indicamos a K8S que use el controlador de AWS para este Ingress
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    # Escuchamos únicamente en el puerto 80 por ahora
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Tipo de destino para los pods (en EKS moderno se usa ip)
    alb.ingress.kubernetes.io/target-type: "ip"
    # ¡Esta anotación le avisa al ALB que use tu health.php para las pruebas de salud!
    alb.ingress.kubernetes.io/healthcheck-path: "/health.php"
spec:
  ingressClassName: "alb"
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hola-mundo-service
                port:
                  number: 8080