apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: empresa-x-ingress
  namespace: default
  annotations:
    # Le indicamos a K8S que use el controlador de AWS para este Ingress
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    # Se definen los puertos que escuchará el ALB de AWS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Regla Opcional para redirigir HTTP A HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Tipo de destino para los pods (En EKS moderno se usa ip)
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  ingressClassName: "alb" # Reemplaza la anotación vieja de clase
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hola-mundo-service # mismo nombre del service.yaml
                port:
                  number: 8080 # Puerto de escucha del backend