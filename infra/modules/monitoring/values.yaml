grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  service:
    type: LoadBalancer
    port: 3000

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true