grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  service:
    type: LoadBalancer
    port: 3000
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
      isDefault: true

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true